<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Crystal Retrieval</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@500;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Space Crystal Retrieval</h1>

    <div id="stats">
        <span>Score: <span id="score">0</span></span>
        <span>Time: <span id="timer">60</span></span>
    </div>
</header>

<section id="instructions">

<h2>Mission</h2>

<p>
Collect 30 energy crystals before time runs out!
Avoid the red alien drone.
</p>

<p>
Move using the Arrow Keys or WASD.
</p>

<button id="startBtn">Start Game</button>

</section>

<div id="gameArea">

<div id="player"></div>

<div id="crystal"></div>

<div id="enemy"></div>

<div id="message" class="overlayMessage"></div>

<button id="restartBtn">Restart Game</button>

</div>

<script src="script.js"></script>

</body>
</html>
