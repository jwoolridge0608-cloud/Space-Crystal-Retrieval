<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Crystal Retrieval</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🚀 Space Crystal Retrieval</h1>

    <div id="stats">
        <span>Score: <span id="score">0</span></span>
        <span>Time: <span id="timer">60</span></span>
    </div>
</header>

<section id="instructions">

<h2>Mission</h2>

<p>
Collect 10 energy crystals before time runs out!
Avoid the red alien drone.
</p>

<p>
Move using the Arrow Keys or WASD.
</p>

<button id="startBtn">Start Game</button>

</section>

<div id="gameArea">

<div id="player"></div>

<div id="crystal"></div>

<div id="enemy"></div>

</div>

<div id="message"></div>

<button id="restartBtn">Restart Game</button>

<script src="script.js"></script>

</body>
</html>
